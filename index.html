<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf7" />
    <script>
      // Aplica o tema antes da primeira pintura (sem piscar): a escolha salva ou, sem ela, a do sistema.
      try {
        var saved = localStorage.getItem('reten-theme')
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1b17')
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <meta
      name="description"
      content="Transforme seus livros favoritos em experiências musicais. O Reten cria playlists no Spotify a partir da atmosfera de cada história."
    />
    <title>Reten — Cada história tem uma trilha sonora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
